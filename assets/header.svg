<svg fill="none" viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    
    <!-- Neon Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1f293d" stroke-width="2" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Abstract Tech Circuits & Glowing Dots -->
  <g opacity="0.35" stroke="#00f2fe" stroke-width="1.5">
    <path d="M 80 40 L 160 40 L 200 80 L 260 80" fill="none" />
    <circle cx="260" cy="80" r="4" fill="#00f2fe" />
    <path d="M 1120 320 L 1040 320 L 1000 280 L 940 280" fill="none" />
    <circle cx="940" cy="280" r="4" fill="#00f2fe" />
    <path d="M 980 40 L 1060 40 L 1100 80" fill="none" />
    <circle cx="980" cy="40" r="4" fill="#8a2be2" />
    <path d="M 100 320 L 180 320 L 220 280" fill="none" />
    <circle cx="220" cy="280" r="4" fill="#8a2be2" />
  </g>

  <!-- Futuristic Logo Hexagon Icon (Left Side) -->
  <g transform="translate(140, 180)">
    <!-- Hexagon Outer Glow -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#0b132b" stroke="url(#cyan-glow)" stroke-width="3" filter="url(#glow)" />
    <!-- Hexagon Inner Accent -->
    <polygon points="0,-54 46,-27 46,27 0,54 -46,27 -46,-27" fill="none" stroke="#8a2be2" stroke-width="1.5" opacity="0.6" />
    <!-- Stylized Futuristic 'K' in center -->
    <path d="M -20 -35 L -20 35 M -20 0 L 20 -35 M -5 0 L 24 35" stroke="#00f2fe" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="20" cy="-35" r="4" fill="#ffffff" />
    <circle cx="24" cy="35" r="4" fill="#ffffff" />
  </g>

  <!-- Typography & Texts -->
  <!-- Badge Label -->
  <rect x="250" y="70" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="266" cy="84" r="5" fill="#10b981" />
  <text x="282" y="89" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE AUTOMATION</text>

  <!-- Brand Title -->
  <text x="250" y="155" fill="url(#cyan-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="3" filter="url(#glow)">KARVION LABS</text>

  <!-- Subtitle Tagline -->
  <text x="252" y="198" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="1">
    Intelligent AI Workflows &bull; End-to-End Test Automation (SQA)
  </text>

  <!-- Description / Academy Info -->
  <text x="252" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Led by <tspan fill="#ffffff" font-weight="600">Abdullah Karif Shahjada</tspan> &bull; Upskilling in Professional SQA @ <tspan fill="#38bdf8" font-weight="600">RSN Foundation</tspan>
  </text>

  <!-- Tech Tags Pills -->
  <g transform="translate(252, 265)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="105" height="30" rx="6" fill="#111827" stroke="#374151" />
    <text x="52" y="19" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Selenium</text>
    
    <!-- Pill 2 -->
    <rect x="115" y="0" width="110" height="30" rx="6" fill="#111827" stroke="#374151" />
    <text x="170" y="19" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Playwright</text>

    <!-- Pill 3 -->
    <rect x="235" y="0" width="95" height="30" rx="6" fill="#111827" stroke="#374151" />
    <text x="282" y="19" fill="#fb923c" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Postman</text>

    <!-- Pill 4 -->
    <rect x="340" y="0" width="85" height="30" rx="6" fill="#111827" stroke="#374151" />
    <text x="382" y="19" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Python</text>

    <!-- Pill 5 -->
    <rect x="435" y="0" width="100" height="30" rx="6" fill="#111827" stroke="#374151" />
    <text x="485" y="19" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">CI/CD &bull; Git</text>
  </g>
</svg>